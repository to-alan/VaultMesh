server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/test-tls/server.crt;
    ssl_certificate_key /etc/nginx/test-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    # Keep browser/API traffic on the same TLS origin. The upstream is only
    # reachable through the Compose network or the host's loopback binding.
    location /api/ {
        proxy_pass http://control:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 2m;
    }

    location = /healthz {
        proxy_pass http://control:8080;
    }

    location = /config.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
