name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vaultmesh_test
          POSTGRES_USER: vaultmesh
          POSTGRES_PASSWORD: vaultmesh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaultmesh -d vaultmesh_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      VAULTMESH_TEST_DATABASE_URL: postgres://vaultmesh:vaultmesh_test@127.0.0.1:5432/vaultmesh_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: go build ./cmd/vaultmesh-server ./cmd/vaultmesh-agent

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: vaultmesh_ci_postgres
      VAULTMESH_ADMIN_USERNAME: admin
      VAULTMESH_ADMIN_PASSWORD: vaultmesh-ci-administrator-password
      VAULTMESH_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      VAULTMESH_ALLOWED_ORIGINS: http://localhost:3000
      VAULTMESH_PUBLIC_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7
      - run: sh -n install.sh
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f deploy/compose.ip-test.yaml config --quiet
      - run: docker build --tag vaultmesh-control:ci .
      - run: docker build --file Dockerfile.web --tag vaultmesh-web:ci .
      - run: docker build --file Dockerfile.agent --tag vaultmesh-agent:ci .
      - name: Smoke test independent containers
        run: |
          cleanup() {
            docker rm --force vaultmesh-control-ci vaultmesh-web-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name vaultmesh-control-ci --publish 127.0.0.1:18081:8080 \
            --env VAULTMESH_ADMIN_USERNAME --env VAULTMESH_ADMIN_PASSWORD \
            --env VAULTMESH_MASTER_KEY --env VAULTMESH_ALLOWED_ORIGINS \
            vaultmesh-control:ci
          docker run --detach --name vaultmesh-web-ci --publish 127.0.0.1:18080:80 \
            --env VAULTMESH_API_BASE_URL=https://api.example.test vaultmesh-web:ci
          curl --fail --silent --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:18081/healthz
          curl --fail --silent --cookie-jar /tmp/vaultmesh-ci-cookie \
            --header 'Content-Type: application/json' \
            --data '{"username":"admin","password":"vaultmesh-ci-administrator-password"}' \
            http://127.0.0.1:18081/api/v1/auth/login
          curl --fail --silent --cookie /tmp/vaultmesh-ci-cookie http://127.0.0.1:18081/api/v1/dashboard
          web_config=$(curl --fail --silent --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:18080/config.txt) || {
            docker logs vaultmesh-web-ci
            exit 1
          }
          printf '%s\n' "$web_config"
          printf '%s\n' "$web_config" | grep --fixed-strings 'https://api.example.test'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/)" = "404"
      - name: Smoke test IP HTTPS proxy
        run: |
          cleanup() {
            docker rm --force vaultmesh-tls-control-ci vaultmesh-tls-web-ci >/dev/null 2>&1 || true
            docker network rm vaultmesh-tls-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          tls_dir=$(mktemp -d)
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$tls_dir/server.key" -out "$tls_dir/server.crt" \
            -subj /CN=localhost -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          docker network create vaultmesh-tls-ci
          docker run --detach --name vaultmesh-tls-control-ci \
            --network vaultmesh-tls-ci --network-alias control \
            --env VAULTMESH_ADMIN_USERNAME --env VAULTMESH_ADMIN_PASSWORD --env VAULTMESH_MASTER_KEY \
            --env VAULTMESH_PUBLIC_API_URL=https://localhost:18443 \
            --env VAULTMESH_ALLOWED_ORIGINS=https://localhost:18443 \
            --env VAULTMESH_COOKIE_SECURE=true vaultmesh-control:ci
          docker run --detach --name vaultmesh-tls-web-ci --network vaultmesh-tls-ci \
            --publish 127.0.0.1:18443:443 \
            --volume "$PWD/deploy/nginx/ip-test.conf:/etc/nginx/conf.d/default.conf:ro" \
            --volume "$tls_dir:/etc/nginx/test-tls:ro" \
            --env VAULTMESH_API_BASE_URL=https://localhost:18443 vaultmesh-web:ci
          curl --fail --silent --cacert "$tls_dir/server.crt" \
            --retry 20 --retry-all-errors --retry-delay 1 https://localhost:18443/healthz
          curl --fail --silent --cacert "$tls_dir/server.crt" \
            https://localhost:18443/api/v1/meta | jq -e '.https_ready == true'
          curl --fail --silent --cacert "$tls_dir/server.crt" \
            --cookie-jar "$tls_dir/cookies" --header 'Content-Type: application/json' \
            --header 'Origin: https://localhost:18443' \
            --data '{"username":"admin","password":"vaultmesh-ci-administrator-password"}' \
            https://localhost:18443/api/v1/auth/login
          curl --fail --silent --cacert "$tls_dir/server.crt" --cookie "$tls_dir/cookies" \
            https://localhost:18443/api/v1/dashboard
          curl --fail --silent --cacert "$tls_dir/server.crt" \
            https://localhost:18443/config.txt | grep --fixed-strings 'https://localhost:18443'
