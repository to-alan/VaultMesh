name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never cancel a partially published release or run two publishers concurrently.
concurrency:
  group: formal-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VAULTMESH_INSTALLER_SOURCE_ONLY=1 source ./install.sh
          valid_version "$TAG" || { echo 'Use vX.Y.Z or vX.Y.Z-rc.N'; exit 1; }
          git merge-base --is-ancestor HEAD origin/main
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > /tmp/release-draft; then
            test "$(cat /tmp/release-draft)" = true || { echo 'Published releases are immutable; choose a new version'; exit 1; }
          fi
          case "$TAG" in *-rc.*) echo 'prerelease=true' >> "$GITHUB_OUTPUT";; *) echo 'prerelease=false' >> "$GITHUB_OUTPUT";; esac

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  agent-binaries:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: linux, goarch: arm, goarm: '7'}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true
      - name: Build and checksum Agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ github.ref_name }}
        run: |
          COMMIT=$(git rev-parse HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X github.com/to-alan/vaultmesh/internal/version.Version=${VERSION} -X github.com/to-alan/vaultmesh/internal/version.Commit=${COMMIT} -X github.com/to-alan/vaultmesh/internal/version.Date=${DATE}"
          mkdir -p dist
          asset="vaultmesh-agent-${GOOS}-${GOARCH}${GOARM:+v${GOARM}}"
          CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o "dist/$asset" ./cmd/vaultmesh-agent
          cd dist
          sha256sum "$asset" > "$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  container-images:
    needs: verify
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {component: control, file: Dockerfile}
          - {component: web, file: Dockerfile.web}
          - {component: agent, file: Dockerfile.agent}
    steps:
      - uses: actions/checkout@v7
      - id: metadata
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.metadata.outputs.commit }}
            DATE=${{ steps.metadata.outputs.date }}
          # No floating latest: consumers resolve a completed stable GitHub Release.
          tags: ${{ steps.metadata.outputs.prefix }}/vaultmesh-${{ matrix.component }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.commit }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=release-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}

  github-release:
    needs: [validate, agent-binaries, container-images]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-agent-*
          merge-multiple: true
      - name: Package deployment kit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sh scripts/package-release.sh "$TAG"
          cd dist
          sha256sum vaultmesh-agent-* vaultmesh-deploy-*.tar.gz install.sh LICENSE VERSION COMMIT | awk '$2 !~ /\.sha256$/' > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Upload draft, then publish only a complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --generate-notes --title "VaultMesh $TAG"
          fi
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true || { echo 'Refusing to overwrite a published release'; exit 1; }
          gh release upload "$TAG" dist/* --clobber
          # Backports and release candidates must not replace a newer stable release.
          latest=false
          if [ "$PRERELEASE" = false ]; then
            # An API failure must not be mistaken for "no prior release".
            previous=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' | sort -V | tail -1)
            VAULTMESH_INSTALLER_SOURCE_ONLY=1 source ./install.sh
            if [ -z "$previous" ] || { valid_version "$previous" && newer_version "$previous" "$TAG"; }; then latest=true; fi
          fi
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE" --latest="$latest"
