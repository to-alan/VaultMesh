name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  agent-binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true
      - name: Build vaultmesh-agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ github.ref_name }}
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X github.com/to-alan/vaultmesh/internal/version.Version=${VERSION} -X github.com/to-alan/vaultmesh/internal/version.Commit=${COMMIT} -X github.com/to-alan/vaultmesh/internal/version.Date=${DATE}"
          # CGO is disabled so every matrix entry cross-compiles from one runner.
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags "${LDFLAGS}" \
            -o "dist/vaultmesh-agent-${GOOS}-${GOARCH}${GOARM:+v${GOARM}}" ./cmd/vaultmesh-agent
          shasum -a 256 "dist/vaultmesh-agent-${GOOS}-${GOARCH}${GOARM:+v${GOARM}}" \
            > "dist/vaultmesh-agent-${GOOS}-${GOARCH}${GOARM:+v${GOARM}}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: vaultmesh-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm == '7' && 'v7' || '' }}
          path: dist/*

  container-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # GHCR rejects uppercase repository names; github.repository may contain
      # them (e.g. to-alan/VaultMesh), so lowercase the full image prefix.
      - id: image-prefix
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push control-plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.image-prefix.outputs.prefix }}/vaultmesh-control:${{ github.ref_name }}
            ${{ steps.image-prefix.outputs.prefix }}/vaultmesh-control:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ${{ steps.image-prefix.outputs.prefix }}/vaultmesh-web:${{ github.ref_name }}
            ${{ steps.image-prefix.outputs.prefix }}/vaultmesh-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.agent
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.image-prefix.outputs.prefix }}/vaultmesh-agent:${{ github.ref_name }}
            ${{ steps.image-prefix.outputs.prefix }}/vaultmesh-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    runs-on: ubuntu-latest
    needs: [agent-binaries, container-images]
    steps:
      # Only the agent artifacts are wanted here; the buildx cache artifacts
      # (*.dockerbuild) stay out of the release bundle.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: vaultmesh-agent-*
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 vaultmesh-agent-* | grep -v '\.sha256' > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/vaultmesh-agent-*
            dist/SHA256SUMS
