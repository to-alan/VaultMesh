services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vaultmesh
      POSTGRES_USER: vaultmesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - vaultmesh-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultmesh -d vaultmesh"]
      interval: 5s
      timeout: 3s
      retries: 20

  control:
    # Prebuilt images are published to GHCR on every release tag. With both
    # image and build set, `docker compose up -d` pulls the published image
    # and `up -d --build` rebuilds locally from this source tree instead.
    image: ghcr.io/to-alan/vaultmesh/vaultmesh-control:${VAULTMESH_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VAULTMESH_LISTEN: :8080
      VAULTMESH_DATABASE_URL: postgres://vaultmesh:${POSTGRES_PASSWORD}@postgres:5432/vaultmesh?sslmode=disable
      VAULTMESH_ADMIN_USERNAME: ${VAULTMESH_ADMIN_USERNAME:-admin}
      VAULTMESH_ADMIN_PASSWORD: ${VAULTMESH_ADMIN_PASSWORD:?set VAULTMESH_ADMIN_PASSWORD in .env}
      VAULTMESH_MASTER_KEY: ${VAULTMESH_MASTER_KEY:?set VAULTMESH_MASTER_KEY in .env}
      VAULTMESH_ALLOWED_ORIGINS: ${VAULTMESH_ALLOWED_ORIGINS:-http://localhost:3000}
      VAULTMESH_WEBAUTHN_RP_ID: ${VAULTMESH_WEBAUTHN_RP_ID:-}
      VAULTMESH_WEBAUTHN_RP_NAME: ${VAULTMESH_WEBAUTHN_RP_NAME:-VaultMesh}
      VAULTMESH_WEBAUTHN_RP_ORIGINS: ${VAULTMESH_WEBAUTHN_RP_ORIGINS:-}
      VAULTMESH_COOKIE_SECURE: ${VAULTMESH_COOKIE_SECURE:-false}
      VAULTMESH_COOKIE_SAME_SITE: ${VAULTMESH_COOKIE_SAME_SITE:-lax}
      VAULTMESH_RETENTION_RUNS_DAYS: ${VAULTMESH_RETENTION_RUNS_DAYS:-90}
      VAULTMESH_RETENTION_COMMANDS_DAYS: ${VAULTMESH_RETENTION_COMMANDS_DAYS:-30}
      VAULTMESH_RETENTION_DELIVERIES_DAYS: ${VAULTMESH_RETENTION_DELIVERIES_DAYS:-90}
      VAULTMESH_RETENTION_INCIDENTS_DAYS: ${VAULTMESH_RETENTION_INCIDENTS_DAYS:-180}
      VAULTMESH_RETENTION_AUDIT_EVENTS_DAYS: ${VAULTMESH_RETENTION_AUDIT_EVENTS_DAYS:-365}
      VAULTMESH_AUTO_MIGRATE: "true"
    ports:
      - "127.0.0.1:${VAULTMESH_API_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    image: ghcr.io/to-alan/vaultmesh/vaultmesh-web:${VAULTMESH_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    environment:
      VAULTMESH_API_BASE_URL: ${VAULTMESH_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:${VAULTMESH_WEB_PORT:-3000}:80"

volumes:
  vaultmesh-postgres:
